<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PDF</title>
  <script src="../shared/boot.js"></script>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="lib/pdf_viewer.css">
  <link rel="stylesheet" href="viewer.css">
  <script type="module" src="viewer.js"></script>
</head>
<body>
  <div id="progress"><i></i></div>

  <header id="bar" class="bar">
    <div class="grp doc"><b id="doc-title">PDF</b></div>

    <div class="grp">
      <button class="tb" id="prev" data-tip="Предыдущая страница"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <label class="pages"><input id="page" inputmode="numeric" value="1"><span id="pages">/ 1</span></label>
      <button class="tb" id="next" data-tip="Следующая страница"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>

    <div class="grp">
      <button class="tb" id="zoom-out" data-tip="Уменьшить (Ctrl −)"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <button class="zoom" id="zoom" data-tip="По ширине страницы">100%</button>
      <button class="tb" id="zoom-in" data-tip="Увеличить (Ctrl +)"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
    </div>

    <div class="grp tools">
      <button class="tb" id="t-hand" data-mode="0" data-tip="Выделение и прокрутка (Esc)"><svg viewBox="0 0 24 24"><path d="M6 3.5 18.5 12 13 13.2l3 6-2.6 1.3-3-6L6 18.5Z"/></svg></button>
      <button class="tb" id="t-ink" data-mode="15" data-tip="Рисовать (D)"><svg viewBox="0 0 24 24"><path d="M4 20c3-1 4.5-4 7-4s2 3 5 3 4-3 4-3M14.5 4.5l3 3L9 16l-4 1 1-4Z"/></svg></button>
      <button class="tb" id="t-text" data-mode="3" data-tip="Надпись (T)"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg></button>
      <button class="tb" id="t-high" data-mode="9" data-tip="Выделить маркером (H)"><svg viewBox="0 0 24 24"><path d="m9 11 6-6 4 4-6 6M9 11l-3 3 4 4 3-3M9 11l4 4M4 21h7"/></svg></button>
      <button class="tb color" id="color" data-tip="Цвет и толщина"><i></i></button>
    </div>

    <div class="grp">
      <button class="tb" id="find-btn" data-tip="Найти (Ctrl+F)"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
      <button class="tb" id="look" data-tip="Вид: светлый / тёмный, тон страниц"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg></button>
      <button class="tb" id="save" data-tip="Сохранить с рисунками (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg></button>
      <button class="tb" id="print" data-tip="Печать — откроется в просмотрщике Chrome"><svg viewBox="0 0 24 24"><path d="M7 8V4h10v4M7 17H5a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M7 14h10v6H7Z"/></svg></button>
    </div>
  </header>

  <div id="find" class="pop find" hidden>
    <input id="find-q" type="search" spellcheck="false">
    <span id="find-res" class="res"></span>
    <button class="tb" id="find-prev"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
    <button class="tb" id="find-next"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>

  <div id="params" class="pop params" hidden>
    <div class="dots" id="dots"></div>
    <label class="slider"><span id="size-label">Толщина</span><input id="size" type="range" min="1" max="20" step="1"><output id="size-out"></output></label>
  </div>

  <div id="look-pop" class="pop look" hidden>
    <div class="cap" id="cap-ui">Интерфейс</div>
    <div class="seg" id="ui-seg"></div>
    <div class="cap" id="cap-page">Страницы</div>
    <div class="seg" id="page-seg"></div>
  </div>

  <div id="viewerContainer" tabindex="0">
    <div id="viewer" class="pdfViewer"></div>
  </div>

  <div id="error" class="error" hidden>
    <b id="err-title">Не получилось открыть PDF</b>
    <p id="err-text"></p>
    <button id="err-native" class="btn">Открыть во встроенном просмотрщике</button>
  </div>
  <div id="drop" class="drop" hidden></div>
  <div id="toast" class="toast" hidden></div>
</body>
</html>
